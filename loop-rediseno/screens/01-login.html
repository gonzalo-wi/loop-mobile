<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>LOOP · 01 · Iniciar sesión</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button,input{font-family:inherit}
input::placeholder{color:#4D5578;opacity:1}
.f:focus-within{box-shadow:0 0 0 3px #2456E6}
.i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
<style>html{background:#D9D6CC}body{display:flex;justify-content:center}</style>
</head>
<body>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #F2F0EA; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #121C4E">

<div style="position: relative; overflow: hidden; flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 340px; padding: 72px 24px 0; border-radius: 0 0 40px 40px; background: #121C4E; color: #FFFFFF">
<span aria-hidden="true" style="position: absolute; top: -90px; right: -90px; width: 220px; height: 220px; border-radius: 50%; background: #2456E6"></span>
<span aria-hidden="true" style="position: absolute; bottom: -90px; left: -80px; width: 160px; height: 160px; border-radius: 50%; background: #8FD45A"></span>
<img src="../assets/logo-loop.png" alt="Ivess" style="position: relative; display: block; width: 148px; height: 130px; object-fit: contain; margin-bottom: 10px">
<div style="position: relative; font-size: 30px; line-height: 36px; font-weight: 800; letter-spacing: 0.12em; padding-left: 0.12em">LOOP</div>
<div style="position: relative; font-size: 15px; line-height: 22px; font-weight: 500; color: #C9D0EA">Control operativo de repartos</div>
</div>

<main style="flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 28px 20px 24px">

<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 800; letter-spacing: -0.03em">Iniciar sesión</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; font-weight: 500; color: #4D5578">Ingresá con tu usuario asignado</p>
</div>

<form style="display: flex; flex-direction: column; gap: 16px; margin: 24px 0 0">

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="c-usuario" style="padding-left: 6px; font-size: 13px; line-height: 18px; font-weight: 700; color: #4D5578">Usuario</label>
<div class="f" style="display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 20px; border-radius: 22px; background: #FFFFFF; color: #4D5578">
<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"></path></svg>
<input id="c-usuario" type="text" placeholder="Tu usuario" autocomplete="username" style="flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; outline: 0; background: transparent; font-size: 16px; font-weight: 700; color: #121C4E">
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="c-clave" style="padding-left: 6px; font-size: 13px; line-height: 18px; font-weight: 700; color: #4D5578">Contraseña</label>
<div class="f" style="display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 8px 0 20px; border-radius: 22px; background: #FFFFFF; color: #4D5578">
<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px"><rect x="5" y="11" width="14" height="10" rx="2.5"></rect><path d="M8 11V7.5a4 4 0 0 1 8 0V11"></path></svg>
<input id="c-clave" type="password" placeholder="Tu contraseña" autocomplete="current-password" style="flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; outline: 0; background: transparent; font-size: 16px; font-weight: 700; color: #121C4E">
<button type="button" aria-label="Mostrar contraseña" style="flex: none; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: #F2F0EA; color: #121C4E; cursor: pointer">
<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
</button>
</div>
</div>

<a href="02-inicio.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 60px; margin-top: 6px; border-radius: 30px; background: #121C4E; color: #FFFFFF; font-size: 17px; font-weight: 800; box-shadow: 0 14px 28px -12px rgba(18,28,78,0.6)">
<span>Ingresar</span>
<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px; stroke-width: 2.25"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</a>

</form>

<div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 4px">
<div style="display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 20px; font-weight: 600; color: #4D5578">
<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="M12 3l7 3v5.5c0 4.5-3 8-7 9.5-4-1.5-7-5-7-9.5V6l7-3z"></path><path d="M9 12l2 2 4-4.5"></path></svg>
<span>Acceso operativo seguro · Ivess</span>
</div>
<div style="font-size: 12px; line-height: 16px; font-weight: 600; color: #4D5578; font-variant-numeric: tabular-nums">LOOP v1.2.3</div>
</div>

</main>
</div>
</body>
</html>
